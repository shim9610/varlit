version: 2
updates:
  - package-ecosystem: cargo
    directories:
      - '/'
      - '/fuzz'
      - '/tools/public-api-fixture'
      - '/tools/rename-fixture'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
