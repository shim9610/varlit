name: CI

# Automatic checks run on pull requests into main. Manual dispatch remains
# available for qualification; merging a checked PR does not start a duplicate run.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 4
  RUST_TEST_THREADS: 4
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings
  # CI-03: every third-party ACTION and every installed cargo TOOL is pinned to
  # an immutable identity. Action refs are commit ids (a tag can be moved; a
  # commit id cannot), with the human readable release next to them, and
  # installed cargo tools carry an exact `--version`. Bump these deliberately,
  # in a commit that says so.
  #
  # This is deliberately NOT a claim that a CI run is reproducible. Two inputs
  # are rolling by design and are not pinned here:
  #
  #   * the runner images `ubuntu-latest`, `windows-latest` and `macos-15-intel`, which GitHub
  #     rebuilds continuously (system libraries, linkers, preinstalled tools);
  #   * the `stable` toolchain requested by every job except `msrv`, which
  #     advances every six weeks.
  #
  # Pinning those would defeat what they exist to catch — a break on a newer
  # compiler or image — so the `msrv (1.95.0)` job is the only job in this
  # workflow that evaluates a fixed toolchain, and no job evaluates a fixed
  # image. A red run on an unchanged commit is therefore an expected outcome,
  # not evidence of a workflow defect.
  #
  #   actions/checkout                v7.0.1
  #   Swatinem/rust-cache             v2.9.3
  #   EmbarkStudios/cargo-deny-action v2.1.1
  #   dtolnay/rust-toolchain          master (the action pins no toolchain of
  #                                   its own; the toolchain is the `toolchain`
  #                                   input below)
  CARGO_AUDIT_VERSION: 0.22.2
  # CI-02: the floor the packages declare (`rust-version` in the workspace
  # Cargo.toml). Kept here so the MSRV job and the manifests are edited
  # together.
  MSRV: 1.95.0

jobs:
  # Documentation-only pull requests skip the jobs that build and run code;
  # see scripts/ci_changes.py. `fmt` and `rustdoc` still run, and the
  # required gate accepts the skipped jobs only for such a change.
  changes:
    if: github.repository == 'shim9610/varlit' && !github.event.repository.private
    name: changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: classify
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/ci_changes.py --base "$BASE" --head HEAD

  verification:
    needs: changes
    if: github.repository == 'shim9610/varlit' && !github.event.repository.private && needs.changes.outputs.docs_only != 'true'
    uses: ./.github/workflows/verification.yml

  storage-contracts:
    needs: changes
    if: github.repository == 'shim9610/varlit' && !github.event.repository.private && needs.changes.outputs.docs_only != 'true'
    name: storage failure and resource contracts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: storage-contracts
      - name: Select fresh evidence directory outside the build cache
        # runner paths are available after job dispatch, not in job-level env.
        # Include the attempt so a rerun cannot reuse earlier evidence.
        run: echo "VARLIT_STORAGE_RUN=$RUNNER_TEMP/varlit-storage-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: Execute failure and memory growth contracts
        run: python3 scripts/check_storage_contracts.py --output "$VARLIT_STORAGE_RUN/contracts"
      - name: Build load example
        run: cargo build --locked --release -p varlit --features integrity --example scalable_load
      - name: Execute real-byte load smoke with eight readers
        run: python3 scripts/load_scalable.py --suite large --only stream-r8-20g --total-gib 0.0625 --epoch-mib 8 --output "$VARLIT_STORAGE_RUN/load-smoke" --data-root "$VARLIT_STORAGE_RUN/load-smoke-data"
      - name: Preserve contract evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storage-contracts
          path: |
            ${{ env.VARLIT_STORAGE_RUN }}/contracts/
            ${{ env.VARLIT_STORAGE_RUN }}/load-smoke/
          if-no-files-found: error
          retention-days: 14

  codeql:
    needs: changes
    if: github.repository == 'shim9610/varlit' && !github.event.repository.private && needs.changes.outputs.docs_only != 'true'
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [rust, python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: .github/codeql/config.yml
          tools: https://github.com/github/codeql-action/releases/download/codeql-bundle-v2.27.2/codeql-bundle-linux64.tar.gz
      - id: codeql-analysis
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:${{ matrix.language }}
      - name: Require clean security results, not only successful analysis upload
        env:
          SARIF_DIRECTORY: ${{ steps.codeql-analysis.outputs.sarif-output }}
          CODEQL_LANGUAGE: ${{ matrix.language }}
        run: python3 scripts/check_codeql_results.py "$SARIF_DIRECTORY/$CODEQL_LANGUAGE.sarif"
      - name: Retain CodeQL findings and analysis diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-${{ matrix.language }}-sarif
          path: ${{ steps.codeql-analysis.outputs.sarif-output }}/${{ matrix.language }}.sarif
          if-no-files-found: error
          retention-days: 14

  fmt:
    # CI runs on the public repository only. `varlit-dev` is private, so runner
    # minutes there are metered against the account; this guard means the
    # workflow file can live in a tree that is pushed to both remotes without
    # ever spending a paid minute. Every job carries it because GitHub has no
    # workflow-level `if`.
    if: github.repository == 'shim9610/varlit' && !github.event.repository.private
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt
      - run: python3 scripts/check_runtime_dependencies.py
      - name: Reject generated archives and oversized tracked files
        run: python3 scripts/check_repository_hygiene.py
      - name: Install the pinned compiler for MIR regression controls
        run: rustup toolchain install 1.95.0 --profile minimal --no-self-update
      - name: CI helper regressions
        run: |
          python3 -m unittest discover -s scripts/tests
          python3 -m unittest discover -s tools/storage-bench -p 'test_*.py'
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path tools/storage-bench/Cargo.toml -- --check
      - name: Format implementation files included in their owning module
        run: |
          rustfmt --edition 2024 --check crates/varlit-core/src/file/*.rs \
            crates/varlit-core/src/format/*.rs \
            crates/varlit-core/src/matrix_tiles/api/*.rs \
            crates/varlit-core/src/matrix_tiles/ring_store/*.rs

  # Discover configurations from Cargo metadata. Adding a feature adds both
  # Clippy and a native singleton test job without editing this workflow.
  feature-config:
    needs: changes
    if: github.repository == 'shim9610/varlit' && !github.event.repository.private && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    outputs:
      checks: ${{ steps.features.outputs.checks }}
      singletons: ${{ steps.features.outputs.singletons }}
      interactions: ${{ steps.features.outputs.interactions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - id: features
        run: python3 scripts/feature_matrix.py

  feature-matrix:
    # CI runs on the public repository only. `varlit-dev` is private, so runner
    # minutes there are metered against the account; this guard means the
    # workflow file can live in a tree that is pushed to both remotes without
    # ever spending a paid minute. Every job carries it because GitHub has no
    # workflow-level `if`.
    if: github.repository == 'shim9610/varlit' && !github.event.repository.private
    name: clippy (${{ matrix.features.name }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: feature-config
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        features: ${{ fromJSON(needs.feature-config.outputs.checks) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.features.name }}
      - name: Clippy
        run: cargo clippy --locked --all-targets ${{ matrix.features.flags }} -- -D warnings

  # Full native test runs on all three platforms use the default and all-feature
  # sets; the feature matrix above lints each discovered singleton, and
  # `feature-tests` below executes those singletons on Linux. This does not
  # enumerate every feature subset. Tests go through the hygiene runner
  # (`tools/varlit-test-runner`) so leaked temp artifacts fail CI.
  test:
    # CI runs on the public repository only. `varlit-dev` is private, so runner
    # minutes there are metered against the account; this guard means the
    # workflow file can live in a tree that is pushed to both remotes without
    # ever spending a paid minute. Every job carries it because GitHub has no
    # workflow-level `if`.
    needs: changes
    if: github.repository == 'shim9610/varlit' && !github.event.repository.private && needs.changes.outputs.docs_only != 'true'
    name: test (${{ matrix.features.name }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        features:
          - { name: default, flags: "--workspace" }
          - { name: all-features, flags: "--workspace --all-features" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: test-${{ matrix.features.name }}
      - name: Test
        env:
          # The trybuild UI cases compare rustc diagnostic prose against snapshots
          # taken on the declared MSRV, so they can only match one compiler. rustc
          # reworded one E0599 phrase and turned two enforcement fixtures red here
          # while they passed on the pinned floor. This job exists to catch a break
          # on a newer compiler, not a reworded diagnostic, so it skips them; the
          # pinned `msrv` job below runs the same suite with them enabled.
          VARLIT_SKIP_UI_SNAPSHOTS: 1
        run: cargo run --locked -p varlit-test-runner -- test --locked ${{ matrix.features.flags }}

  # Execute on the native OS: a cross-check cannot exercise tempfile lifetime,
  # positional reads, file replacement, mmap or an independently opened reader.
  platform-io:
    needs: changes
    if: github.repository == 'shim9610/varlit' && !github.event.repository.private && needs.changes.outputs.docs_only != 'true'
    name: bounded I/O (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: platform-io
      - name: Small-budget I/O, independent readers and generation replacement
        run: python scripts/check_platform_io.py --output target/platform-io
      - name: Preserve native logs and platform identity
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: platform-io-${{ matrix.os }}
          path: target/platform-io/
          if-no-files-found: error
          retention-days: 14

  # Acquire the scarce hosted macOS pool once. All three native checks still
  # run and each failure fails this required job; no infrastructure error is
  # converted into success. This reduces acquisitions, not provider outages.
  macos-native:
    needs: changes
    if: github.repository == 'shim9610/varlit' && !github.event.repository.private && needs.changes.outputs.docs_only != 'true'
    name: native tests and bounded I/O (macos-15-intel)
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      VARLIT_SKIP_UI_SNAPSHOTS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: macos-native
      - name: Default native tests
        run: cargo run --locked -p varlit-test-runner -- test --locked --workspace
      - name: All-feature native tests
        if: ${{ !cancelled() }}
        run: cargo run --locked -p varlit-test-runner -- test --locked --workspace --all-features
      - name: Small-budget I/O, independent readers and generation replacement
        if: ${{ !cancelled() }}
        run: python scripts/check_platform_io.py --output target/platform-io
      - name: Preserve native logs and platform identity
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: platform-io-macos-15-intel
          path: target/platform-io/
          if-no-files-found: error
          retention-days: 14

  # Execute every discovered singleton, including future features. Default/all
  # runs cannot reach not(feature = ...) branches. Keep native OS test coverage
  # above for I/O; singleton qualification runs on Linux to bound CI cost.
  feature-tests:
    # CI runs on the public repository only. `varlit-dev` is private, so runner
    # minutes there are metered against the account; this guard means the
    # workflow file can live in a tree that is pushed to both remotes without
    # ever spending a paid minute. Every job carries it because GitHub has no
    # workflow-level `if`.
    if: github.repository == 'shim9610/varlit' && !github.event.repository.private
    name: test (${{ matrix.features.name }}, ubuntu-latest)
    runs-on: ubuntu-latest
    needs: feature-config
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        features: ${{ fromJSON(needs.feature-config.outputs.singletons) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: test-${{ matrix.features.name }}
      - name: Test
        env:
          # The trybuild UI cases compare rustc diagnostic prose against snapshots
          # taken on the declared MSRV, so they can only match one compiler. rustc
          # reworded one E0599 phrase and turned two enforcement fixtures red here
          # while they passed on the pinned floor. This job exists to catch a break
          # on a newer compiler, not a reworded diagnostic, so it skips them; the
          # pinned `msrv` job below runs the same suite with them enabled.
          VARLIT_SKIP_UI_SNAPSHOTS: 1
        run: cargo run --locked -p varlit-test-runner -- test --locked ${{ matrix.features.flags }}

  # Every pair of independently selectable features; all others start off.
  feature-interactions:
    # CI runs on the public repository only. `varlit-dev` is private, so runner
    # minutes there are metered against the account; this guard means the
    # workflow file can live in a tree that is pushed to both remotes without
    # ever spending a paid minute. Every job carries it because GitHub has no
    # workflow-level `if`.
    if: github.repository == 'shim9610/varlit' && !github.event.repository.private
    name: interactions (${{ matrix.features.name }})
    runs-on: ubuntu-latest
    needs: feature-config
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        features: ${{ fromJSON(needs.feature-config.outputs.interactions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: test-${{ matrix.features.name }}
      - name: Test
        env:
          # The trybuild UI cases compare rustc diagnostic prose against snapshots
          # taken on the declared MSRV, so they can only match one compiler. rustc
          # reworded one E0599 phrase and turned two enforcement fixtures red here
          # while they passed on the pinned floor. This job exists to catch a break
          # on a newer compiler, not a reworded diagnostic, so it skips them; the
          # pinned `msrv` job below runs the same suite with them enabled.
          VARLIT_SKIP_UI_SNAPSHOTS: 1
        run: cargo run --locked -p varlit-test-runner -- test --locked ${{ matrix.features.flags }}

  # CI-02: the packages declare `rust-version = 1.95`. Every other job installs
  # moving stable, so once stable advances past the floor nothing proves the
  # floor still builds. This job pins the declared MSRV exactly and both checks
  # and tests against it, which is what makes the manifest claim true rather
  # than aspirational.
  msrv:
    # CI runs on the public repository only. `varlit-dev` is private, so runner
    # minutes there are metered against the account; this guard means the
    # workflow file can live in a tree that is pushed to both remotes without
    # ever spending a paid minute. Every job carries it because GitHub has no
    # workflow-level `if`.
    needs: changes
    if: github.repository == 'shim9610/varlit' && !github.event.repository.private && needs.changes.outputs.docs_only != 'true'
    # Literal, not `${{ env.MSRV }}`: the `env` context is not available in
    # `jobs.<id>.name`. The value is asserted against the manifests below.
    name: msrv (1.95.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.MSRV }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: msrv
      - name: Declared MSRV matches the toolchain under test
        run: |
          declared="$(cargo metadata --locked --no-deps --format-version 1 \
            | tr ',' '\n' | grep -o '"rust_version":"[^"]*"' | head -n 1 \
            | cut -d'"' -f4)"
          echo "manifest rust-version: ${declared}"
          case "${MSRV}" in
            "${declared}"|"${declared}".*) ;;
            *)
              echo "::error::MSRV job pins ${MSRV} but the manifests declare ${declared}"
              exit 1
              ;;
          esac
      - name: cargo check
        run: cargo check --locked --workspace --all-targets --all-features
      - name: cargo test
        run: cargo run --locked -p varlit-test-runner -- test --locked --workspace --all-features

  # API2-05 regression guard: a downstream crate that renames the varlit
  # dependency (`vv = { package = "varlit", … }`) must compile and run with no
  # `extern crate` workaround. trybuild cannot express a renamed dependency
  # (it reuses the host crate's dependency graph), so this is a standalone
  # fixture crate outside the workspace; unit tests on the token-rewrite
  # helper demonstrably missed the `IDENT: ::varlit::…` expansion shape that
  # only a real downstream build exercises.
  renamed-dependency:
    # CI runs on the public repository only. `varlit-dev` is private, so runner
    # minutes there are metered against the account; this guard means the
    # workflow file can live in a tree that is pushed to both remotes without
    # ever spending a paid minute. Every job carries it because GitHub has no
    # workflow-level `if`.
    needs: changes
    if: github.repository == 'shim9610/varlit' && !github.event.repository.private && needs.changes.outputs.docs_only != 'true'
    name: renamed-dependency fixture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: renamed-dependency
          workspaces: tools/rename-fixture
      - name: Build and run the renamed-dependency fixture
        working-directory: tools/rename-fixture
        run: cargo run --locked

  # API-03/API-04 regression guard, and the structural gate for the whole class:
  # a downstream crate that derives blocks over EVERY public codec and field
  # type the documentation tells users to use. Round 3 added a mandatory
  # non-zero `SCHEMA_ID` contract for field codecs and never gave the built-in
  # public types `ChunkedBytes` and `PackedBitmap` an identity, so the derive
  # macro began rejecting documented public API. No in-workspace test noticed,
  # because none of them derived a block over the public surface the way a
  # consumer does. This crate is outside the workspace for the same reason
  # `rename-fixture` is: it must resolve `varlit` through its own manifest.
  public-api:
    # CI runs on the public repository only. `varlit-dev` is private, so runner
    # minutes there are metered against the account; this guard means the
    # workflow file can live in a tree that is pushed to both remotes without
    # ever spending a paid minute. Every job carries it because GitHub has no
    # workflow-level `if`.
    needs: changes
    if: github.repository == 'shim9610/varlit' && !github.event.repository.private && needs.changes.outputs.docs_only != 'true'
    name: public-api fixture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: public-api
          workspaces: tools/public-api-fixture
      - name: Build and run the public-API fixture
        working-directory: tools/public-api-fixture
        run: cargo run --locked

  # DOC-02 (F-12) release gate: docs.rs builds the published documentation with
  # warnings that nothing in this workflow previously evaluated — a broken
  # intra-doc link, an unresolved `[`Type`]`, or a private-item link renders as
  # plain text on the published page and no other job notices. `RUSTDOCFLAGS`
  # applies to the rustdoc invocation for every crate in the graph, so
  # `--workspace` covers all three published crates at once, and
  # `--document-private-items` is deliberately NOT used: the gate must evaluate
  # exactly the surface a user sees on docs.rs.
  #
  # F-06: `--all-features` matches docs.rs *because the three publishable
  # manifests say so*, not by coincidence. All three declare
  # `[package.metadata.docs.rs] all-features = true`; without that declaration
  # docs.rs would use its default selection, which for `default = []` is no
  # optional feature at all, and every feature-gated public item would be
  # absent from the published page while this job happily checked a surface no
  # user sees. If that metadata is ever removed, this job stops gating docs.rs.
  #
  # The second step gates the *other* surface a user can compile: the crates
  # with no optional feature enabled. It is not the docs.rs surface; it exists
  # so a link that only resolves when some feature is on cannot break the
  # minimal build.
  #
  # Rustdoc EXAMPLES are gated by the `test` jobs above, not here: the runner
  # forwards to plain `cargo test`, which compiles and runs doctests. That is
  # only meaningful because the two proc-macro entry-point examples are no
  # longer ```ignore — while they were, they compiled in no job at all and were
  # free to drift from the macros they document.
  rustdoc:
    # CI runs on the public repository only. `varlit-dev` is private, so runner
    # minutes there are metered against the account; this guard means the
    # workflow file can live in a tree that is pushed to both remotes without
    # ever spending a paid minute. Every job carries it because GitHub has no
    # workflow-level `if`.
    needs: changes
    if: github.repository == 'shim9610/varlit' && !github.event.repository.private
    name: rustdoc (-D warnings)
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: rustdoc
      - name: cargo doc (docs.rs surface, all features)
        run: cargo doc --locked --workspace --all-features --no-deps
      - name: cargo doc (minimal surface, no default features)
        run: cargo doc --locked --workspace --no-default-features --no-deps
      - name: Current documentation links and executable quickstart
        run: python3 scripts/check_docs.py --quickstart
      # A documentation-only change skips the test jobs, so the tests that read
      # the documents run here instead.
      - name: Tests that read the documentation (documentation-only change)
        if: needs.changes.outputs.docs_only == 'true'
        run: |
          cargo test --locked -p varlit --features integrity --test doc_claims --test doc_dsl_examples
          cargo test --locked -p varlit --features integrity --test matrix \
            the_allocator_failure_narrowing_is_published_with_the_outcome_family

  # Release gate: audit/deny failures block the merge.
  supply-chain:
    # CI runs on the public repository only. `varlit-dev` is private, so runner
    # minutes there are metered against the account; this guard means the
    # workflow file can live in a tree that is pushed to both remotes without
    # ever spending a paid minute. Every job carries it because GitHub has no
    # workflow-level `if`.
    needs: changes
    if: github.repository == 'shim9610/varlit' && !github.event.repository.private && needs.changes.outputs.docs_only != 'true'
    name: deny + audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
      - name: cargo-audit
        run: |
          cargo install cargo-audit --locked --version "$CARGO_AUDIT_VERSION"
          cargo audit
      - name: Vendored package advisories and detection control
        run: |
          python3 scripts/check_vendored_advisories.py --self-test
          python3 scripts/check_vendored_advisories.py

  # F-09 negative policy fixture. `deny.toml` enables `allow-wildcard-paths`,
  # which is a CATEGORY allowance, not an allowance for the single
  # `varlit-macros` dev edge that motivated it. A passing `cargo deny check`
  # proves the accepted shape is accepted; it proves nothing about what is
  # still refused, so the two shapes the comment in `deny.toml` claims are
  # DENIED are asserted here by introducing each one and requiring the gate to
  # fail. Without this, silently widening the exception (or a cargo-deny
  # behaviour change) would look exactly like a green build.
  #
  # Each mutation runs on a fresh checkout, so nothing is restored and no
  # ordering between the two steps matters.
  dependency-policy-fixture:
    # CI runs on the public repository only. `varlit-dev` is private, so runner
    # minutes there are metered against the account; this guard means the
    # workflow file can live in a tree that is pushed to both remotes without
    # ever spending a paid minute. Every job carries it because GitHub has no
    # workflow-level `if`.
    needs: changes
    if: github.repository == 'shim9610/varlit' && !github.event.repository.private && needs.changes.outputs.docs_only != 'true'
    name: deny negative fixture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Introduce a registry wildcard in a published crate
        run: |
          set -euo pipefail
          sed -i 's|^proptest\.workspace = true$|proptest = "*"|' crates/varlit/Cargo.toml
          grep -q 'proptest = "\*"' crates/varlit/Cargo.toml
      - id: registry-wildcard
        continue-on-error: true
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check bans
      - name: A registry wildcard must be denied
        run: |
          test "${{ steps.registry-wildcard.outcome }}" = "failure" \
            || { echo "deny.toml accepted a registry wildcard"; exit 1; }
      - name: Restore, then introduce a non-dev path wildcard in a published crate
        run: |
          set -euo pipefail
          git checkout -- crates/varlit/Cargo.toml
          sed -i 's|^varlit-core = { path = "\.\./varlit-core", version = "[^"]*" }$|varlit-core = { path = "../varlit-core" }|' crates/varlit/Cargo.toml
          grep -q '^varlit-core = { path = "\.\./varlit-core" }$' crates/varlit/Cargo.toml
      - id: path-wildcard
        continue-on-error: true
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check bans
      - name: A non-dev path wildcard in a published crate must be denied
        run: |
          test "${{ steps.path-wildcard.outcome }}" = "failure" \
            || { echo "deny.toml accepted a non-dev path wildcard from a published crate"; exit 1; }

  # REL-01 release gate: `fuzz/` is an independent workspace with its own
  # lockfile and its own license policy, so nothing in the root workspace jobs
  # resolves it. A stale `fuzz/Cargo.lock` was therefore invisible to CI.
  # Locked resolution fails the build instead of silently updating the
  # lockfile, and the final diff proves that no gate in this job rewrote it
  # (an unlocked cargo-deny metadata resolution is exactly how the staleness
  # was masked locally).
  fuzz-supply-chain:
    # CI runs on the public repository only. `varlit-dev` is private, so runner
    # minutes there are metered against the account; this guard means the
    # workflow file can live in a tree that is pushed to both remotes without
    # ever spending a paid minute. Every job carries it because GitHub has no
    # workflow-level `if`.
    needs: changes
    if: github.repository == 'shim9610/varlit' && !github.event.repository.private && needs.changes.outputs.docs_only != 'true'
    name: fuzz workspace (locked)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      # Before any caching or tooling step: `Swatinem/rust-cache` and
      # cargo-deny both run an unlocked `cargo metadata`, which would rewrite a
      # stale lockfile and mask the very defect this job exists to catch.
      - name: Locked resolution
        working-directory: fuzz
        run: cargo metadata --locked --format-version 1 > /dev/null
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: fuzz
          workspaces: fuzz
      - name: cargo check
        working-directory: fuzz
        run: cargo check --locked --all-targets
      - name: Deterministic fuzz regressions
        working-directory: fuzz
        run: cargo test --locked --lib
      - name: cargo-audit
        run: |
          cargo install cargo-audit --locked --version "$CARGO_AUDIT_VERSION"
          cargo audit --file fuzz/Cargo.lock
      # cargo-deny resolves `fuzz/deny.toml` from the fuzz workspace root; that
      # policy allows NCSA for `libfuzzer-sys`, which the publishable
      # workspace's policy deliberately does not.
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          manifest-path: fuzz/Cargo.toml
      - name: Fuzz lockfile was not rewritten
        run: git diff --exit-code -- fuzz/Cargo.lock

  # Verify archives before the first registry release. Cargo stages sibling
  # packages in a local registry, so the facade is verified before publication.
  package-archives:
    needs: changes
    if: github.repository == 'shim9610/varlit' && !github.event.repository.private && needs.changes.outputs.docs_only != 'true'
    name: verified package archives
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: package-archives
      - name: Build and verify all publishable archives
        run: cargo package --locked --workspace --exclude varlit-test-runner
      - name: Inspect package names, licenses and public contents
        run: python3 scripts/check_package_archives.py

  # Keep source notices and an independent Git consumer covered too.
  source-contents:
    needs: changes
    if: github.repository == 'shim9610/varlit' && !github.event.repository.private && needs.changes.outputs.docs_only != 'true'
    name: source contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Source distribution includes README and licenses
        run: |
          set -euo pipefail
          git ls-files --error-unmatch README.md LICENSE-MIT LICENSE-APACHE
          for package in varlit varlit-core varlit-macros; do
            git ls-files --error-unmatch "crates/${package}/LICENSE-MIT" "crates/${package}/LICENSE-APACHE"
          done

  git-consumer:
    needs: changes
    if: github.repository == 'shim9610/varlit' && !github.event.repository.private && needs.changes.outputs.docs_only != 'true'
    # Preserve the existing status-check name used by branch protection.
    name: Git consumer + pinned dependency sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: git-consumer
      - name: Resolve and run an independent consumer without root patches
        run: python3 scripts/check_git_consumer.py

  # Build the committed tree exactly as a source package consumer sees it:
  # `git archive` contains only tracked files, so a workspace member or
  # fixture that exists locally but was never committed fails here
  # (REL-01 regression guard).
  clean-archive:
    # CI runs on the public repository only. `varlit-dev` is private, so runner
    # minutes there are metered against the account; this guard means the
    # workflow file can live in a tree that is pushed to both remotes without
    # ever spending a paid minute. Every job carries it because GitHub has no
    # workflow-level `if`.
    needs: changes
    if: github.repository == 'shim9610/varlit' && !github.event.repository.private && needs.changes.outputs.docs_only != 'true'
    name: clean source archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Unpack tracked files only
        run: git archive --format=tar --prefix=varlit-archive/ HEAD | tar -x -C "$RUNNER_TEMP"
      - name: cargo metadata
        working-directory: ${{ runner.temp }}/varlit-archive
        run: cargo metadata --locked --no-deps --format-version 1 > /dev/null
      - name: cargo check
        working-directory: ${{ runner.temp }}/varlit-archive
        run: cargo check --workspace --all-targets --all-features --locked
      # The fuzz workspace is not a root workspace member, so the two steps
      # above never touch it. Its tracked-file completeness and lockfile
      # freshness need the same clean-archive treatment (REL-01).
      - name: cargo metadata (fuzz workspace)
        working-directory: ${{ runner.temp }}/varlit-archive/fuzz
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: cargo check (fuzz workspace)
        working-directory: ${{ runner.temp }}/varlit-archive/fuzz
        run: cargo check --locked --all-targets
      # The two out-of-workspace fixtures are tracked files too, and neither of
      # the checks above resolves them. A fixture whose sources or lockfile were
      # never committed must fail here, not in its own job on the next run.
      - name: cargo metadata (rename fixture)
        working-directory: ${{ runner.temp }}/varlit-archive/tools/rename-fixture
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: cargo metadata (public-api fixture)
        working-directory: ${{ runner.temp }}/varlit-archive/tools/public-api-fixture
        run: cargo metadata --locked --format-version 1 > /dev/null

  i686:
    # 32-bit support is checked, not proven on hardware: an x86_64 Linux
    # runner executes i686 binaries directly, so this builds the workspace
    # for a target whose `usize` is 32 bits and runs the library and
    # integration tests there. varlit-core converts file-sized `u64` values
    # to `usize` only through checked helpers (`width.rs`); this job is what
    # notices a new unchecked path. Examples are not built: they add build
    # time and nothing the tests do not exercise.
    needs: changes
    if: github.repository == 'shim9610/varlit' && !github.event.repository.private && needs.changes.outputs.docs_only != 'true'
    name: test (all-features, i686 32-bit)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: i686-unknown-linux-gnu
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: i686
      - name: Install the 32-bit C toolchain and runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib
      - name: Test as 32-bit binaries
        env:
          VARLIT_SKIP_UI_SNAPSHOTS: 1
        run: |
          cargo test --locked --target i686-unknown-linux-gnu --workspace --all-features \
            --lib --tests --no-fail-fast

  s390x:
    # Big-endian support is checked under emulation, not on hardware: the
    # workspace is cross-built for s390x and its library and integration
    # tests run under QEMU's user mode (registered with binfmt, so tests that
    # re-execute themselves work too). Every integer in a file is converted
    # with an explicit byte order, which `enforcement_gates` holds in the
    # source; this job is what runs the paths on a big-endian target,
    # including those Miri's interpreter is too slow for. Tests run one at a
    # time: QEMU's user mode crashes itself, about once in fifty runs, when
    # several threads unwind at once (`decoder_contracts`; never serially and
    # never natively). Debug info is left out to keep the cross build within
    # the runner's disk.
    needs: changes
    if: github.repository == 'shim9610/varlit' && !github.event.repository.private && needs.changes.outputs.docs_only != 'true'
    name: test (all-features, s390x big-endian, QEMU)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      RUST_TEST_THREADS: 1
      CARGO_TARGET_S390X_UNKNOWN_LINUX_GNU_LINKER: s390x-linux-gnu-gcc
      CARGO_TARGET_S390X_UNKNOWN_LINUX_GNU_RUNNER: qemu-s390x -L /usr/s390x-linux-gnu
      QEMU_LD_PREFIX: /usr/s390x-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: s390x-unknown-linux-gnu
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: s390x
      - name: Install the s390x cross toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user qemu-user-binfmt gcc-s390x-linux-gnu \
            libc6-dev-s390x-cross
      - name: Register QEMU for s390x executables
        # Tests that re-execute themselves need the kernel to hand s390x
        # binaries to QEMU; the package registers it, and this makes sure.
        run: |
          if [ ! -e /proc/sys/fs/binfmt_misc/qemu-s390x ]; then
            sudo mount -t binfmt_misc binfmt_misc /proc/sys/fs/binfmt_misc || true
            sudo sh -c 'cat /usr/lib/binfmt.d/qemu-s390x.conf > /proc/sys/fs/binfmt_misc/register'
          fi
          test -e /proc/sys/fs/binfmt_misc/qemu-s390x
      - name: Test as big-endian binaries
        env:
          VARLIT_SKIP_UI_SNAPSHOTS: 1
        run: |
          cargo test --locked --target s390x-unknown-linux-gnu --workspace --all-features \
            --lib --tests --no-fail-fast

  bench-harness:
    # The cross-format harness is a separate workspace that only the manual
    # Performance A/B workflow builds, so nothing caught it when it stopped
    # linking on macOS. Build it on each operating system and run one tiny
    # pass of two scenarios, so a platform assumption fails here, not on
    # someone's machine. HDF5 is left out (it builds its C library with
    # CMake); the Rust engines and SQLite are built and run.
    needs: changes
    if: github.repository == 'shim9610/varlit' && !github.event.repository.private && needs.changes.outputs.docs_only != 'true'
    name: bench harness (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: bench-harness
          workspaces: tools/format-bench
      - name: Build the harness
        run: cargo build --release --locked --no-default-features --manifest-path tools/format-bench/Cargo.toml
      - name: Run a tiny pass
        run: |
          PY="$(command -v python3 || command -v python)"
          "$PY" tools/format-bench/run.py --data-gb 0.02 --only oltp,mixed --formats varlit,sqlite \
            --out "$RUNNER_TEMP/bench-harness"
          "$PY" - "$RUNNER_TEMP/bench-harness/results.jsonl" <<'PYEOF'
          import json, sys
          rows = [json.loads(l) for l in open(sys.argv[1])]
          failed = [r for r in rows if r.get("failed")]
          assert rows and not failed, failed
          print(rows[0]["platform"])
          PYEOF
      - name: Check that cold reads are cold
        run: |
          PY="$(command -v python3 || command -v python)"
          out="$(tools/format-bench/target/release/varlit-format-bench evict-check "$RUNNER_TEMP/evict-check")"
          echo "$out"
          "$PY" -c 'import json,sys; r=json.loads(sys.argv[1]); a=r["resident_after"]; assert a is None or a < 0.1, r' "$out"
      - name: Run the memory-capped scenario (small shape)
        env:
          FB_GRID: small
        run: |
          PY="$(command -v python3 || command -v python)"
          "$PY" tools/format-bench/run.py --only grid --formats varlit --out "$RUNNER_TEMP/bench-grid"
          "$PY" -c 'import json,sys; r=[json.loads(l) for l in open(sys.argv[1])]; assert r and not any(x.get("failed") for x in r), r; print(r[0].get("memcap"))' "$RUNNER_TEMP/bench-grid/results.jsonl"

  required-gate:
    # Keep this name stable: main protection requires this aggregate check.
    if: always() && github.repository == 'shim9610/varlit' && !github.event.repository.private
    name: ci / required
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - changes
      - verification
      - codeql
      - fmt
      - feature-config
      - feature-matrix
      - test
      - platform-io
      - macos-native
      - feature-tests
      - feature-interactions
      - storage-contracts
      - msrv
      - i686
      - s390x
      - renamed-dependency
      - public-api
      - rustdoc
      - supply-chain
      - dependency-policy-fixture
      - fuzz-supply-chain
      - package-archives
      - source-contents
      - git-consumer
      - clean-archive
      - bench-harness
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every configured job to succeed
        env:
          VARLIT_CI_NEEDS: ${{ toJSON(needs) }}
          VARLIT_CI_DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
        run: python3 scripts/check_ci_results.py
