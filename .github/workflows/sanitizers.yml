name: Sanitizers

# Fuzzing, Miri, and AddressSanitizer live outside `ci.yml` because they answer
# a different question on a different clock. `ci.yml` gates every pull
# request on "does this change break a contract"; these jobs ask "is there a
# memory-safety defect nobody has noticed yet" — a property of the whole tree,
# not of a diff, and one that costs hours rather than minutes. Run on PRs into
# main and by explicit dispatch; neither branch pushes nor a schedule duplicate
# the checked PR. A failure is investigated with its retained evidence. The one
# scheduled workflow, `fuzz-corpus.yml`, repeats none of these jobs: it only
# grows and saves the corpus the fuzz smoke run below starts from.
#
# What each tool can actually see — measured on 2026-08-08, not assumed:
#
#   * ASan runs the real suite with the real syscalls under `--all-features`,
#     so the mmap / zero-copy surface is exercised. It is the primary tool for
#     this codebase.
#   * Miri interprets the unit tests of the modules that contain `unsafe`
#     code it can execute: raw vector fills, raw allocation and the tile
#     reader lock. The crates deny `unsafe_code`; `scripts/miri-scope.json`
#     names every file that allows it and, for the mmap, foreign-call and
#     Windows-only ones Miri refuses, what covers them instead. Tests of
#     modules without `unsafe` are not interpreted: safe Rust cannot cause
#     undefined behaviour by itself, and interpreting all of them took over
#     five hours. It is the one tool here that reports UB that does not crash.
#   * The fuzz smoke run exists so a target that stops building, or crashes
#     within its first minutes, is caught on a PR instead of on the next manual
#     campaign. It is not a campaign itself: 90 seconds per target finds smoke,
#     not deep states.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # CI-03, same rule as ci.yml: installed cargo tools carry an exact version.
  CARGO_FUZZ_VERSION: 0.13.2

jobs:
  fuzz-smoke:
    # CI runs on the public repository only. `varlit-dev` is private, so runner
    # minutes there are metered against the account; this guard means the
    # workflow file can live in a tree that is pushed to both remotes without
    # ever spending a paid minute. Every job carries it because GitHub has no
    # workflow-level `if`.
    if: github.repository == 'shim9610/varlit' && !github.event.repository.private
    name: fuzz smoke (every target, 90s each)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: fuzz-smoke
          workspaces: fuzz
      - name: install cargo-fuzz
        run: cargo install cargo-fuzz --locked --version "$CARGO_FUZZ_VERSION"
      # Start from the corpus `fuzz-corpus.yml` saves on the default branch,
      # when there is one: the 90 seconds below then continue from what
      # earlier runs reached. This job only reads it. Without a saved corpus
      # the run starts from the generated seeds, as before.
      - name: restore the saved corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-
      # The target list comes from `cargo fuzz list`, not from a list written
      # here, so a target added to `fuzz/Cargo.toml` is in this job the same
      # week — a hardcoded list is how a new target silently never runs.
      # On a crash, libFuzzer prints the input (as a Debug value for arbitrary
      # targets) and writes it under fuzz/artifacts/. Preserve the actual input
      # and corpus so a failed oracle can be replayed locally.
      - name: build and run every target briefly
        working-directory: fuzz
        run: |
          cargo run --locked --example generate_corpus
          cargo run --locked --example generate_matrix_reuse_corpus
          cargo fuzz build
          for target in $(cargo fuzz list); do
            echo "::group::${target}"
            cargo fuzz run "$target" -- -max_total_time=90 -rss_limit_mb=4096
            echo "::endgroup::"
          done

      - name: retain fuzz reproductions
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-reproductions
          path: |
            fuzz/artifacts/
            fuzz/corpus/
          retention-days: 14

  asan:
    # Same public-repository guard as above.
    if: github.repository == 'shim9610/varlit' && !github.event.repository.private
    name: address sanitizer + leaks
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
          # `-Zbuild-std` rebuilds the standard library under the sanitizer,
          # which is what lets ASan see into std-owned allocations; it needs
          # the source.
          components: rust-src
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: asan
      # LeakSanitizer matches its suppressions against *symbolized* frames, and
      # the one suppression this repository has names a test function. With no
      # symbolizer the frames are bare addresses, nothing matches, and the run
      # fails on the single leak that is a test's premise.
      #
      # That is exactly what happened on 2026-08-24:
      # `SUMMARY: AddressSanitizer: 3502 byte(s) leaked in 6 allocation(s)` --
      # the same 6 allocations, and the same 3502 bytes, that the suppression
      # accounts for when it can read them. Reproduced afterwards by re-running
      # one unchanged binary two ways: with `symbolize=0` it exits 1 with that
      # summary, and with a symbolizer it exits 0 reporting
      # `6  3502  a_record_appended_past_the_digest_falls_back`.
      #
      # rustup's `llvm-tools` component does **not** ship `llvm-symbolizer` --
      # checked, the component installs a set of llvm binaries and that is not
      # one of them -- so adding it to `components:` above would not have fixed
      # this. The runner image carries one; find it explicitly rather than hope
      # it is on PATH, and fail here when it is not. A missing symbolizer must
      # stop the job at this step, because downstream it does not look like a
      # missing symbolizer: it looks like a leak in whichever test happens to
      # own the suppressed allocation.
      - name: locate llvm-symbolizer
        run: |
          for candidate in \
            "$(command -v llvm-symbolizer || true)" \
            $(ls -1 /usr/lib/llvm-*/bin/llvm-symbolizer 2>/dev/null | sort -V | tail -1) \
            $(ls -1 /usr/bin/llvm-symbolizer-* 2>/dev/null | sort -V | tail -1); do
            if [ -x "$candidate" ]; then
              echo "symbolizing with $candidate"
              echo "ASAN_SYMBOLIZER_PATH=$candidate" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "::error::no llvm-symbolizer found; LeakSanitizer suppressions match on symbolized frames, so this run would report a suppressed test premise as a leak"
          exit 1
      # Three env choices, each with a measured reason:
      #
      #   * `VARLIT_SKIP_UI_SNAPSHOTS=1` — trybuild runs its fixtures by
      #     spawning nested cargo builds, and the children inherit
      #     `RUSTFLAGS=-Zsanitizer=address` without the `-Zbuild-std` that
      #     makes it linkable: every fixture fails on build machinery, not on
      #     the contract it pins. A sanitizer has nothing to observe in a
      #     compile-time test; the plain CI jobs run them uninstrumented.
      #   * `detect_leaks=1` — leak detection is part of the point, not an
      #     extra. Without the suppression file the suite exits 101 while all
      #     tests pass, because LeakSanitizer reports at process exit.
      #   * the suppression file names ONE test function whose leak is its
      #     premise (`std::mem::forget` of a writer, to model a writer that
      #     died before flushing) -- which is why the step above must have
      #     found a symbolizer, because a name cannot match an unsymbolized
      #     frame. It deliberately does not name the leaking
      #     frame — that is the append hot path, where a real leak would
      #     matter most. See the file's own comments.
      #
      # `--tests` runs the unit and integration test targets and not doctests;
      # doctests compile as separate crates that do not get `-Zbuild-std`.
      - name: test suite under AddressSanitizer
        env:
          RUSTFLAGS: -Zsanitizer=address
          ASAN_OPTIONS: detect_leaks=1
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/.github/lsan-suppressions.txt
          VARLIT_SKIP_UI_SNAPSHOTS: "1"
        run: |
          cargo test -Zbuild-std --target x86_64-unknown-linux-gnu \
            -p varlit -p varlit-core --all-features --tests

  miri:
    # Same public-repository guard as above.
    if: github.repository == 'shim9610/varlit' && !github.event.repository.private
    name: miri (unsafe modules)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          # Match the interpreter used to qualify this gate. Review the
          # exclusions again when updating, rather than silently drifting.
          toolchain: nightly-2026-10-12
          components: miri
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: miri
      # The runner checks that the files allowing `unsafe` are exactly those
      # in scripts/miri-scope.json, selects the unit tests of the interpreted
      # ones and verifies the final test count. Unknown unsupported calls, UB
      # and all other failures stay fatal. Default alias/validity checks
      # remain enabled.
      - name: unit tests of the unsafe modules under Miri
        run: python3 scripts/check_miri.py
      # The same unsafe code interpreted for a 32-bit and a big-endian
      # target: layouts and allocation sizes differ on the first, and the
      # bulk numeric decode swaps bytes only on the second.
      - name: unit tests of the unsafe modules under Miri, 32-bit
        run: python3 scripts/check_miri.py --target i686-unknown-linux-gnu --output target/miri-report/i686
      - name: unit tests of the unsafe modules under Miri, big-endian
        run: python3 scripts/check_miri.py --target s390x-unknown-linux-gnu --output target/miri-report/s390x
      # Nothing executes big-endian code natively in CI, so Miri is also the
      # only place the byte-order-sensitive safe code runs on such a target:
      # the wire layouts, the row packers, the snapshot codecs and keyed
      # storage's layouts and tree pages (a file's keys must order alike on
      # every platform; its model tests run natively). The matrix
      # tile tests are left out for their cost under an interpreter; their
      # encoding uses explicit little-endian conversions throughout. Of keyed
      # storage's tree tests only those that run under Miri are named: the
      # others are `cfg_attr(miri, ignore)` for their thousands of ring
      # writes, and the runner requires every selected test to execute.
      - name: byte-order-sensitive unit tests under Miri, big-endian
        run: |
          python3 scripts/check_miri.py --target s390x-unknown-linux-gnu \
            --prefix native_layout:: --prefix format:: --prefix anchor:: \
            --prefix packed_rows:: --prefix spill_rows:: --prefix snapshot:: \
            --prefix scalable_extent:: --prefix sync_marker:: \
            --prefix keyed_heap::node:: --prefix keyed_heap::cache:: \
            --prefix keyed_heap::tests::a_few_puts_and_deletes_match_a_model \
            --prefix keyed_heap::tests::a_reader_keeps_its_generation_until_it_follows \
            --prefix keyed_heap::tests::block_types_have_their_own_trees \
            --prefix keyed_heap::tests::the_state_layout_is_the_same_bytes_on_every_platform \
            --output target/miri-report/s390x-logic
      - name: ownership refusal, callback errors and real cleanup under Miri
        run: python3 scripts/check_miri.py --test fallible_ownership --output target/miri-report/ownership
      - name: array decoding and partial-drop contracts under Miri
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
        run: |
          set -o pipefail
          cargo +nightly-2026-10-12 miri test --locked -p varlit \
            --no-default-features --test codec_array_allocation \
            2>&1 | tee target/miri-report/codec-array.log
          grep -Fq 'test result: ok. 6 passed; 0 failed' target/miri-report/codec-array.log
      - name: retain Miri selection, toolchain and complete logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: miri-report
          path: target/miri-report/
          retention-days: 14
