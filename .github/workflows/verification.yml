name: Verification

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_BUILD_JOBS: 4
  CARGO_LLVM_COV_VERSION: 0.9.1
  CARGO_CYCLONEDX_VERSION: 0.5.9
  KANI_VERSION: 0.68.0

jobs:
  coverage:
    if: github.repository == 'shim9610/varlit' && !github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: '1.95.0'
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: coverage
      - run: cargo install cargo-llvm-cov --locked --version "$CARGO_LLVM_COV_VERSION"
      - name: Instrument unit and integration tests
        env:
          # Nested trybuild snapshots are already checked by ordinary CI.
          VARLIT_SKIP_UI_SNAPSHOTS: '1'
        run: cargo llvm-cov --workspace --all-features --lib --tests --locked --no-report
      - name: Export coverage and uncovered line locations
        run: |
          mkdir -p target/coverage
          exclude='/(vendor|tests|examples|tools)/|/src/verification/'
          cargo llvm-cov report --ignore-filename-regex "$exclude" --json --output-path target/coverage/coverage.json
          cargo llvm-cov report --ignore-filename-regex "$exclude" --html --output-dir target/coverage
          cargo llvm-cov report --ignore-filename-regex "$exclude" --show-missing-lines > target/coverage/missing-lines.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: target/coverage/
          if-no-files-found: error
          retention-days: 14

  kani:
    if: github.repository == 'shim9610/varlit' && !github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: '1.95.0'
      - run: cargo install kani-verifier --locked --version "$KANI_VERSION"
      - run: cargo kani setup
      - name: Check every registered core proof, including unwinding assertions
        run: |
          set -o pipefail
          mkdir -p target/verification
          cargo metadata --locked --format-version 1 > /dev/null
          cargo kani -p varlit-core --default-unwind 5 2>&1 | tee target/verification/kani.log
          # Fail on accidental removal/selection of zero or partial harnesses.
          grep -Fq 'Checking harness file::record_extent_proofs::checked_extent_matches_wide_arithmetic...' target/verification/kani.log
          grep -Fq 'Checking harness file::resident_index::uniform_prefix_proofs::observed_prefix_never_invents_membership...' target/verification/kani.log
          grep -Fq 'Checking harness disk_index::publication_proofs::accepted_metadata_has_consistent_publication_frontiers...' target/verification/kani.log
          grep -Fq 'Checking harness disk_index::publication_proofs::valid_clean_frontiers_are_not_rejected...' target/verification/kani.log
          grep -Fq 'Checking harness disk_index::publication_proofs::restore_cannot_change_the_confirmed_frontier...' target/verification/kani.log
          grep -Fq 'Checking harness disk_index::publication_proofs::valid_checkpoint_restore_is_not_rejected...' target/verification/kani.log
          grep -Fq 'Checking harness publication_protocol::proofs::commit_survives_every_io_failure_effect...' target/verification/kani.log
          grep -Fq 'Checking harness publication_protocol::proofs::poisoned_writer_never_reaches_publication...' target/verification/kani.log
          grep -Fq 'Checking harness publication_protocol::proofs::resumed_writer_cannot_acknowledge_a_volatile_head...' target/verification/kani.log
          grep -Fq 'Checking harness publication_protocol::proofs::successful_commit_is_reachable_and_durable...' target/verification/kani.log
          grep -Fq 'Checking harness publication_protocol::proofs::nonconfirmed_publications_do_not_use_a_second_head...' target/verification/kani.log
          grep -Fq 'Checking harness publication_protocol::proofs::recovery_never_publishes_before_truncate_and_sync...' target/verification/kani.log
          grep -Fq 'Checking harness publication_protocol::proofs::follow_error_preserves_the_entire_reader...' target/verification/kani.log
          grep -Fq 'Checking harness publication_protocol::proofs::frontier_invariant_is_preserved_by_an_arbitrary_transition...' target/verification/kani.log
          grep -Fq 'Checking harness publication_protocol::proofs::initial_frontier_satisfies_the_inductive_invariant...' target/verification/kani.log
          grep -Eq '^Complete - [1-9][0-9]* successfully verified harnesses, 0 failures,' target/verification/kani.log
          git diff --exit-code -- Cargo.lock
      - name: Verify production bindings and reject every broken publication protocol
        run: python3 scripts/check_publication_protocol.py --output target/verification/protocol-mutations
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: kani
          path: target/verification/
          retention-days: 14

  loom:
    if: github.repository == 'shim9610/varlit' && !github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: '1.95.0'
      - name: Explore production cancellation and progress interleavings
        env:
          RUSTFLAGS: --cfg varlit_loom -D warnings
        run: cargo run --locked --manifest-path tools/verification/Cargo.toml
      - name: Audit isolated model dependencies
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit --file tools/verification/Cargo.lock

  sbom:
    if: github.repository == 'shim9610/varlit' && !github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: '1.95.0'
      - run: cargo install cargo-cyclonedx --locked --version "$CARGO_CYCLONEDX_VERSION"
      - run: cargo fetch --locked
      - run: python3 scripts/generate_sbom.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-sboms
          path: target/sbom/
          if-no-files-found: error
          retention-days: 30
