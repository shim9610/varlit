[package]
name = "varlit-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
tempfile = "3"

[dependencies.varlit]
path = "../crates/varlit"
version = "0.13.0-alpha.2"
features = ["integrity", "mmap", "zero-copy", "compression-zstd", "experimental-matrix-reuse", "scalable-fault-injection"]

# Use independent workspace for fuzzers
[workspace]
members = ["."]


[[bin]]
name = "native_arbitrary"
path = "fuzz_targets/native_arbitrary.rs"
test = false
doc = false
bench = false

