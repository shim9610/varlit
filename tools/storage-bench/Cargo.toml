[package]
name = "varlit-storage-bench"
version = "0.0.0"
edition = "2024"
publish = false
[workspace]
[features]
default = ["read-validation"]
read-validation = []
guarded-mmap = []
[dependencies]
varlit = { path = "../../crates/varlit", features = ["integrity", "mmap"] }
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.154"
[profile.release]
opt-level = 3
